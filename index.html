<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEN7</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 85% 20%,rgba(125,0,25,.55),transparent 28%),
    radial-gradient(circle at 10% 45%,rgba(0,160,255,.20),transparent 30%),
    #050505;
  color:white;
  font-family:Arial,sans-serif;
}
.hero{
  min-height:100vh;
  padding:32px 24px 60px;
  max-width:700px;
  margin:auto;
}
.logo{
  font-size:30px;
  font-weight:900;
}
.logo span{color:#29c7ff}
.tag{
  display:inline-block;
  margin-top:45px;
  padding:9px 14px;
  border:1px solid rgba(41,199,255,.4);
  border-radius:30px;
  color:#29c7ff;
  font-size:12px;
  letter-spacing:1px;
}
h1{
  font-size:60px;
  line-height:.9;
  letter-spacing:-4px;
  margin:25px 0 0;
}
.red{color:#e11b36}
.lead{
  color:#b6b6bd;
  font-size:17px;
  line-height:1.65;
  margin-top:25px;
}
.buttons{
  display:grid;
  gap:12px;
  margin-top:28px;
}
.btn{
  padding:16px;
  text-align:center;
  border-radius:10px;
  font-weight:bold;
  text-decoration:none;
}
.primary{
  background:#29c7ff;
  color:#00151d;
}
.secondary{
  background:#101014;
  color:white;
  border:1px solid #37373d;
}
.model{
  height:390px;
  margin-top:45px;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.14);
  background:
    radial-gradient(circle at 70% 28%,rgba(210,15,45,.55),transparent 30%),
    radial-gradient(circle at 25% 70%,rgba(41,199,255,.25),transparent 35%),
    linear-gradient(160deg,#242126,#080808 70%);
}
.model small{
  color:#29c7ff;
  letter-spacing:2px;
}
.model strong{
  font-size:34px;
  margin-top:8px;
}
.model span{color:#999}
</style>
</head>

<body>
<section class="hero">

  <div class="logo">MEN<span>7</span></div>

  <div class="tag">PRIVATE · VERIFIED · 18+</div>

  <h1>
    HOMBRES<br>
    QUE QUIERES<br>
    <span class="red">VER.</span>
  </h1>

  <p class="lead">
    Descubre creadores masculinos, contenido exclusivo y una
    experiencia privada diseñada para adultos.
  </p>

  <div class="buttons">
    <a class="btn primary" href="#">Explorar creadores</a>
    <a class="btn secondary" href="#">Ser creador</a>
  </div>

  <di<div class="hero-card">
  <img src="5369E5F2-123D-4C68-9F64-C5A08192462D.png" alt="Alex - creador destacado MEN7" class="hero-photo">

  <div class="hero-overlay">
    <small>FEATURED CREATOR · VERIFIED</small>
    <h2>ALEX</h2>
    <p>Fitness · Lifestyle · Premium</p>
  </div>
</div>

</section>
</body>
</html>
